services:
  - type: web
    name: blood-donation-finder-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false

      # Email config — set these in Render dashboard after deployment
      # Use SendGrid SMTP for production (free: 100 emails/day)
      # - key: EMAIL_HOST
      #   value: smtp.sendgrid.net
      # - key: EMAIL_PORT
      #   value: 587
      # - key: EMAIL_USER
      #   value: apikey
      # - key: EMAIL_PASS
      #   sync: false
      # - key: EMAIL_FROM
      #   sync: false
