services:
  - type: web
    name: blood-donation-finder-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false

      # ── Email (use SendGrid — Gmail does NOT work on Render) ──
      # Sign up: https://sendgrid.com → create API key → verify sender
      - key: EMAIL_SERVICE
        value: sendgrid
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        value: apikey
      - key: EMAIL_PASS
        sync: false      # Set to your SendGrid API key (starts with SG.)
      - key: EMAIL_FROM
        sync: false      # Must be a verified sender in SendGrid
      - key: EMAIL_FROM_NAME
        value: Blood Ocean
